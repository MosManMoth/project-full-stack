name: group3project

services:
  db:
    image: postgres:16
    container_name: group3project-db
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: reservation_db
    ports:
      - "5432:5432"
    volumes:
      - group3project_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d reservation_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: group3project-api
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: app
      DB_PASSWORD: app
      DB_NAME: reservation_db
    ports:
      - "8000:8000"
    volumes:
      - ./backend/public/qrcodes:/app/public/qrcodes
    depends_on:
      db:
        condition: service_healthy

volumes:
  group3project_pgdata: